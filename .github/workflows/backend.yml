name: Deploy MineBeacon API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minebeacon-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set production runtime secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$MONGODB_URI" && test -n "$CRON_SECRET" && test -n "$VERCEL_TOKEN"
          printf '%s' "$MONGODB_URI" | npx vercel env add MONGODB_URI production --type secret --force --token "$VERCEL_TOKEN"
          printf '%s' "$CRON_SECRET" | npx vercel env add CRON_SECRET production --type secret --force --token "$VERCEL_TOKEN"
      - name: Deploy production API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
